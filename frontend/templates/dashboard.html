<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { if (localStorage.getItem("thn_theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch(e){}</script>
<title>Groupings</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
<style>
/* ── Design tokens ─────────────────────────────────────────── */
:root{
    --bg:#f4f6f9;
    --surface:#ffffff;
    --surface-muted:#f8fafc;
    --border:#e2e8f0;

    --text:#1e293b;
    --text-muted:#64748b;
    --text-faint:#94a3b8;

    --accent:#2563eb;
    --accent-soft:#eef4ff;
    --accent-dark:#1d4ed8;

    --success:#16a34a;
    --success-soft:#f0fdf4;
    --warning:#d97706;
    --warning-soft:#fffbeb;
    --danger:#dc2626;
    --danger-soft:#fef2f2;

    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:16px;

    --shadow-sm:0 1px 2px rgba(15,23,42,.05);
    --shadow-md:0 4px 12px rgba(15,23,42,.06);
    --shadow-lg:0 10px 28px rgba(15,23,42,.12);
}

*{ box-sizing:border-box; }

body{
    margin:0;
    font-family:"Segoe UI", Inter, Arial, sans-serif;
    font-size:14px;
    background:var(--bg);
    color:var(--text);
}

/* ── Header ────────────────────────────────────────────────── */
.header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#1e293b;
    color:white;
    padding:14px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:var(--shadow-md);
}

.header div:first-child{
    font-weight:700;
    font-size:15px;
    letter-spacing:.3px;
}

#phTime{
    font-size:12px;
    color:rgba(255,255,255,.75);
}

.main-content{
    padding:20px;
    /* No max-width cap: it left a dead gap on the right when the sidebar
       was collapsed. Width now follows whatever space the sidebar leaves. */
    width:auto;
    max-width:none;
    min-width:0;
}
html body .main-content{ max-width:none; }

/* ── Search ────────────────────────────────────────────────── */
.search-wrap{ padding:16px 0 4px; position:relative; }

#globalSearch{
    width:320px;
    max-width:100%;
    padding:10px 14px;
    border-radius:var(--radius-md);
    border:1px solid var(--border);
    outline:none;
    background:var(--surface);
    font-size:13px;
    transition:border-color .15s, box-shadow .15s;
}

#globalSearch:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
}

.search-dropdown{
    width:280px;
    max-width:100%;
    max-height:220px;
    overflow-y:auto;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    margin-top:6px;
    display:none;
    font-size:12.5px;
    box-shadow:var(--shadow-md);
}

/* ── Filter bar ────────────────────────────────────────────── */
.filter-bar{
    margin-top:6px;
    display:flex;
    gap:16px;
    padding:14px 16px;
    background:var(--surface);
    border-radius:var(--radius-lg);
    border:1px solid var(--border);
    box-shadow:var(--shadow-sm);
    width:fit-content;
    flex-wrap:wrap;
    align-items:flex-end;
}

.filter-group{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.filter-label{
    font-size:10.5px;
    font-weight:700;
    color:var(--text-muted);
    letter-spacing:.6px;
    text-transform:uppercase;
}

.filter-select{
    padding:9px 12px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    background:var(--surface);
    font-size:13px;
    cursor:pointer;
    transition:border-color .15s;
}

.filter-select:hover,
.filter-select:focus{
    border-color:var(--accent);
}

/* ── Buttons (flat, one hover style, no shine sweep) ─────────── */
button{
    border:none;
    border-radius:var(--radius-sm);
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:background-color .15s, border-color .15s, opacity .15s;
}

button:disabled{
    cursor:not-allowed;
    opacity:.5;
}

.btn-add-line,
.btn-import,
.btn-transfer,
.unlock-btn,
.lock-btn{
    padding:9px 16px;
    font-size:13px;
}

.btn-add-line{
    background:var(--accent);
    color:white;
}
.btn-add-line:hover{ background:var(--accent-dark); }

.btn-import{
    background:var(--success);
    color:white;
}
.btn-import:hover{ background:#15803d; }

.btn-export{
    padding:9px 16px;
    font-size:13px;
    background:var(--success);
    color:white;
}
.btn-export:hover{ background:#15803d; }

.btn-transfer{
    background:var(--surface);
    color:var(--accent);
    border:1px solid var(--border);
}
.btn-transfer:hover{ background:var(--accent-soft); border-color:var(--accent); }

.unlock-btn{
    background:var(--surface);
    color:var(--accent);
    border:1px solid var(--accent);
}
.unlock-btn:hover{ background:var(--accent); color:white; }

.lock-btn{
    background:var(--accent);
    color:white;
    border:1px solid var(--accent);
}

/* ── Toolbar row ───────────────────────────────────────────── */
.toolbar-row{
    display:flex;
    gap:10px;
    align-items:center;
    margin-top:16px;
    flex-wrap:wrap;
}

/* ── Grid of line/sheet cards ──────────────────────────────── */
.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:16px;
    margin-top:16px;
}

@media(max-width:1400px){ .grid{grid-template-columns:repeat(4,1fr);} }
@media(max-width:1100px){ .grid{grid-template-columns:repeat(3,1fr);} }
@media(max-width:800px){  .grid{grid-template-columns:repeat(2,1fr);} }
@media(max-width:500px){  .grid{grid-template-columns:1fr;} }

.card{
    background:var(--surface);
    border:1px solid var(--border);
    border-top:3px solid var(--accent);
    border-radius:var(--radius-lg);
    padding:14px;
    box-shadow:var(--shadow-sm);
    transition:border-color .15s, box-shadow .15s;
}

.card:hover{
    border-color:var(--accent);
    box-shadow:var(--shadow-md);
}

#unassigned-card{
    border-top:3px solid var(--text-faint);
    background:var(--surface-muted);
}

.card-fixed{
    border-top:3px solid var(--text-faint);
    background:var(--surface-muted);
}

.title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-weight:700;
    font-size:13px;
}

.badge{
    background:var(--accent-soft);
    color:var(--accent);
    padding:3px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
}

.action-bar{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:10px;
}

.btn-add{
    padding:5px 10px;
    background:var(--accent-soft);
    color:var(--accent);
    border:1px solid var(--border);
    font-size:12px;
    border-radius:var(--radius-sm);
}

.btn-save{
    padding:5px 10px;
    background:var(--success-soft);
    color:var(--success);
    border:1px solid var(--border);
    font-size:12px;
    border-radius:var(--radius-sm);
}

.btn-reset{
    padding:5px 10px;
    background:var(--danger-soft);
    color:var(--danger);
    border:1px solid var(--border);
    font-size:12px;
    border-radius:var(--radius-sm);
}

/* ── Employee rows ─────────────────────────────────────────── */
.emp{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 10px;
    margin-bottom:5px;
    border-radius:var(--radius-sm);
    background:var(--surface-muted);
    border:1px solid transparent;
    font-size:12.5px;
    transition:border-color .15s, background-color .15s;
}

.emp:hover{
    border-color:var(--accent);
    background:var(--accent-soft);
}

.emp-name{ cursor:pointer; }

.remove{
    cursor:pointer;
    color:var(--danger);
    font-weight:700;
    font-size:14px;
    padding-left:8px;
}

/* ── Sections within a card ────────────────────────────────── */
.section-list{ display:flex; flex-direction:column; gap:10px; }

.section-block{
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    overflow:hidden;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 10px;
    background:var(--surface-muted);
    border-bottom:1px solid var(--border);
    color:var(--text-muted);
}

.section-label{ font-size:11px; font-weight:700; letter-spacing:.4px; }

.section-count{
    font-size:11px;
    font-weight:700;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-muted);
    padding:2px 8px;
    border-radius:20px;
}

.section-employees{ padding:8px; }

/* ── Pagination (shared by card + department views) ───────── */
.pagination-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    padding-top:8px;
    border-top:1px solid var(--border);
    font-size:12px;
    color:var(--text-muted);
}

.pagination-row button{
    padding:4px 10px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    background:var(--surface);
    font-size:12px;
}
.pagination-row button:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }

/* ── Department view ───────────────────────────────────────── */
.dept-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--dept-color, var(--accent));
    border-radius:var(--radius-lg);
    overflow:hidden;
    margin-bottom:18px;
    box-shadow:var(--shadow-sm);
}

.dept-card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    background:var(--surface-muted);
    border-bottom:1px solid var(--border);
    cursor:pointer;
    user-select:none;
}

.dept-card-header:hover{ background:var(--accent-soft); }

.dept-card.collapsed .dept-card-header{ border-bottom:none; }

.dept-card-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:14px;
    color:var(--dept-color, var(--text));
}

.dept-card-chevron{
    display:inline-block;
    font-size:11px;
    transition:transform .15s;
}

.dept-card.collapsed .dept-card-chevron{ transform:rotate(-90deg); }

.dept-card-body{
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.dept-card.collapsed .dept-card-body{ display:none; }

.dept-line-group{
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    overflow:hidden;
}

.dept-line-group.expanded .dept-line-header{
    border-bottom:1px solid var(--border);
}

.dept-line-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    background:var(--surface-muted);
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    user-select:none;
}

.dept-line-header:hover{ background:var(--accent-soft); }

.dept-chevron{
    display:inline-block;
    color:var(--text-muted);
    font-size:10px;
    transition:transform .15s;
    margin-right:6px;
}

.dept-line-group.expanded .dept-chevron{ transform:rotate(90deg); }

.dept-line-body{
    display:none;
    padding:8px 10px;
    flex-direction:column;
    gap:4px;
}

.dept-line-group.expanded .dept-line-body{ display:flex; }

.dept-empty{
    color:var(--text-faint);
    font-size:13px;
    text-align:center;
    padding:24px;
}

/* ── Transfer toolbar (bottom bar) ─────────────────────────── */
.transfer-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:fixed;
    bottom:0; left:0; right:0;
    background:#1e293b;
    color:white;
    padding:14px 24px;
    z-index:3000;
    box-shadow:0 -6px 20px rgba(0,0,0,.18);
    font-size:14px;
}

.transfer-toolbar .count-pill{
    background:var(--accent);
    color:white;
    padding:4px 12px;
    border-radius:20px;
    font-weight:700;
    font-size:13px;
}

.transfer-toolbar-btn-primary{
    padding:10px 20px;
    background:var(--accent);
    color:white;
    font-size:13px;
}
.transfer-toolbar-btn-primary:hover:not(:disabled){ background:var(--accent-dark); }
.transfer-toolbar-btn-primary:disabled{ background:#334155; }

.transfer-toolbar-btn-cancel{
    padding:10px 20px;
    background:transparent;
    color:rgba(255,255,255,.75);
    border:1px solid rgba(255,255,255,.25);
    font-size:13px;
}
.transfer-toolbar-btn-cancel:hover{ background:rgba(255,255,255,.08); }

/* ── Modals ────────────────────────────────────────────────── */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    backdrop-filter:blur(4px);
    z-index:2000;
}

.box{
    background:var(--surface);
    width:420px;
    margin:7% auto;
    padding:22px;
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
}

.box h3{ margin-top:0; }

.scroll-box{
    max-height:230px;
    overflow-y:auto;
    padding:10px;
    border-radius:var(--radius-md);
    border:1px solid var(--border);
    background:var(--surface-muted);
}

.scroll-box::-webkit-scrollbar{ width:6px; }
.scroll-box::-webkit-scrollbar-thumb{ background:var(--text-faint); border-radius:10px; }

.drag-over{
    border:2px dashed var(--accent) !important;
    background:var(--accent-soft) !important;
}

/* ── Toolbar buttons (dark mode) ───────────────────────────── */
html[data-theme="dark"] .toolbar-row .btn-import,
html[data-theme="dark"] .toolbar-row .btn-export{
    background:#15803d !important;
    color:#ffffff !important;
    border:1px solid #22c55e !important;
}
html[data-theme="dark"] .toolbar-row .btn-import:hover:not(:disabled),
html[data-theme="dark"] .toolbar-row .btn-export:hover:not(:disabled){
    background:#16a34a !important;
}
html[data-theme="dark"] .toolbar-row .btn-transfer{
    background:#1b2640 !important;
    color:#e5eaf5 !important;
    border:1px solid rgba(255,255,255,.18) !important;
}
html[data-theme="dark"] .toolbar-row .btn-transfer:hover:not(:disabled){
    background:#26345a !important;
    border-color:#60a5fa !important;
    color:#ffffff !important;
}
html[data-theme="dark"] .toolbar-row button:disabled{
    opacity:.45 !important;
    cursor:not-allowed;
}

/* ── Line summary modal (light + dark) ─────────────────────── */
.sm-overlay{
    --sm-surface:#ffffff; --sm-text:#1e293b; --sm-muted:#64748b; --sm-faint:#94a3b8;
    --sm-border:#e5e7eb;  --sm-row-border:#f1f5f9; --sm-dept-bg:#e2e8f0; --sm-dept-text:#0f172a;
    --sm-input-bg:#ffffff; --sm-btn-bg:#ffffff;
    --sm-present-bg:#f0fdf4; --sm-present:#16a34a;
    --sm-late-bg:#fffbeb;    --sm-late:#d97706;
    --sm-absent-bg:#fef2f2;  --sm-absent:#dc2626;
    --sm-nowork-bg:#f8fafc;  --sm-nowork:#64748b;
    --sm-total-bg:#f1f5f9;   --sm-total:#475569;
    --sm-pending:#2563eb; --sm-error:#7c3aed;
    --sm-badge-dept-bg:#eef2ff; --sm-badge-dept:#4338ca;
    --sm-banner-bg:#fef2f2; --sm-banner-border:#fecaca;
}
html[data-theme="dark"] .sm-overlay{
    background:rgba(2,6,16,.72) !important;
    --sm-surface:#172033; --sm-text:#e5eaf5; --sm-muted:#a3afc7; --sm-faint:#7d8aa5;
    --sm-border:rgba(255,255,255,.12); --sm-row-border:rgba(255,255,255,.07);
    --sm-dept-bg:#26324b; --sm-dept-text:#e5eaf5;
    --sm-input-bg:#0f1727; --sm-btn-bg:#223049;
    --sm-present-bg:rgba(34,197,94,.14);  --sm-present:#4ade80;
    --sm-late-bg:rgba(245,158,11,.14);    --sm-late:#fbbf24;
    --sm-absent-bg:rgba(239,68,68,.15);   --sm-absent:#f87171;
    --sm-nowork-bg:rgba(148,163,184,.12); --sm-nowork:#b6c0d4;
    --sm-total-bg:rgba(96,165,250,.14);   --sm-total:#93c5fd;
    --sm-pending:#60a5fa; --sm-error:#a78bfa;
    --sm-badge-dept-bg:rgba(129,140,248,.2); --sm-badge-dept:#c7d2fe;
    --sm-banner-bg:rgba(239,68,68,.14); --sm-banner-border:rgba(239,68,68,.4);
}
.sm-box, .sm-box *{ text-transform:uppercase; }
.sm-box{ background:var(--sm-surface); color:var(--sm-text); border:1px solid var(--sm-border);
    border-radius:12px; padding:24px; max-width:800px; width:90%; max-height:85vh; overflow-y:auto; }
.sm-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.sm-head h2{ margin:0; color:var(--sm-text); }
.sm-head small{ color:var(--sm-muted); font-size:13px; }
.sm-close{ cursor:pointer; font-size:20px; color:var(--sm-muted); }
.sm-close:hover{ color:var(--sm-text); }
.sm-badge{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; margin-left:8px; vertical-align:middle; }
.sm-badge-dept{ background:var(--sm-badge-dept-bg); color:var(--sm-badge-dept); }
.sm-badge-muted{ background:var(--sm-total-bg); color:var(--sm-total); }
.sm-banner{ background:var(--sm-banner-bg); border:1px solid var(--sm-banner-border); color:var(--sm-absent);
    padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:13px; font-weight:700; }
.sm-cards{ display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
.sm-card{ flex:1; min-width:100px; border-radius:8px; padding:12px; text-align:center; }
.sm-card-label{ font-size:11px; font-weight:700; }
.sm-card-value{ font-size:22px; font-weight:700; color:var(--sm-text); }
.sm-card-pct{ font-size:11px; }
.sm-card-present{ background:var(--sm-present-bg); } .sm-card-present .sm-card-label{ color:var(--sm-present); }
.sm-card-late{ background:var(--sm-late-bg); }       .sm-card-late .sm-card-label,.sm-card-late .sm-card-pct{ color:var(--sm-late); }
.sm-card-absent{ background:var(--sm-absent-bg); }   .sm-card-absent .sm-card-label,.sm-card-absent .sm-card-pct{ color:var(--sm-absent); }
.sm-card-nowork{ background:var(--sm-nowork-bg); }   .sm-card-nowork .sm-card-label{ color:var(--sm-nowork); }
.sm-card-total{ background:var(--sm-total-bg); }     .sm-card-total .sm-card-label{ color:var(--sm-total); }
.sm-table{ width:100%; border-collapse:collapse; }
.sm-table th{ text-align:left; padding:6px 8px; font-size:11px; color:var(--sm-faint); text-transform:uppercase;
    border-bottom:2px solid var(--sm-border); }
.sm-table td{ padding:6px 8px; }
.sm-row{ border-bottom:1px solid var(--sm-row-border); }
.sm-name{ font-size:13px; color:var(--sm-text); }
.sm-muted{ font-size:12px; color:var(--sm-muted); }
.sm-table td.sm-muted{ font-size:12px; }
.sm-status{ font-size:12px; font-weight:700; }
.sm-st-present{ color:var(--sm-present); } .sm-st-late{ color:var(--sm-late); } .sm-st-absent{ color:var(--sm-absent); }
.sm-st-pending{ color:var(--sm-pending); } .sm-st-error{ color:var(--sm-error); } .sm-st-nowork{ color:var(--sm-nowork); }
.sm-dept-row{ background:var(--sm-dept-bg); color:var(--sm-dept-text); font-weight:700; padding:8px !important; }
.sm-empty{ padding:12px !important; text-align:center; color:var(--sm-faint); }
.sm-input{ width:100%; font-size:12px; padding:4px 6px; border:1px solid var(--sm-border); border-radius:4px;
    background:var(--sm-input-bg); color:var(--sm-text); }
.sm-input::placeholder{ color:var(--sm-faint); }
.sm-pager{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:8px;
    border-top:1px solid var(--sm-border); }
.sm-btn{ padding:4px 10px; border-radius:8px; border:1px solid var(--sm-border); background:var(--sm-btn-bg);
    color:var(--sm-text); cursor:pointer; font-size:12px; }
.sm-btn:disabled{ opacity:.45; cursor:not-allowed; }

/* ── Responsive tweaks ─────────────────────────────────────── */
@media(max-width:820px){
    .header{ padding:12px 16px; }
    .main-content{ padding:14px; }
    #globalSearch{ width:100%; }
    .filter-bar{ width:100%; }
    .filter-group{ flex:1 1 150px; }
    .filter-select{ width:100%; }
    .box{ width:min(420px, calc(100vw - 28px)); margin:12vh auto; }
}

@media(max-width:480px){
    .toolbar-row > button{ flex:1 1 100%; }
    .filter-bar{ padding:12px; gap:10px; }
}
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/ui-refresh.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}?v=7">
<script defer src="{{ url_for('static', filename='js/theme.js') }}?v=6"></script>
</head>

<body>
{% include 'sidebar.html' %}

<div class="main-content">

<!-- HEADER -->
<div class="header">
    <div>Employee Grouping Dashboard</div>
    <div>
        <span id="phTime"></span>
    </div>
</div>

<!-- SEARCH -->
<div class="search-wrap">
    <input
        id="globalSearch"
        type="text"
        placeholder="🔍 Search employee..."
        oninput="globalSearch(this.value)"
    >
    <div id="searchResults" class="search-dropdown"></div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
    <div class="filter-group">
        <label class="filter-label">Shift</label>
        <select id="shiftFilter" class="filter-select" onchange="filterShift()">
            <option value="all" selected>All Shifts</option>
            <option value="Day Shift" >Day Shift</option>
            <option value="Night Shift">Night Shift</option>
        </select>
    </div>

    <div class="filter-group">
        <label class="filter-label">Line</label>
        <select id="lineFilter" class="filter-select" onchange="filterLines()">
            <option value="all">All Lines</option>
        </select>
    </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar-row">
    <button
        class="btn-transfer"
        onclick="toggleDepartmentView()"
        id="deptFilterBtn"
        {% if role_info.role == "Viewer" %}disabled{% endif %}>
        🏢 Filter by Department
    </button>
    <button
        class="btn-import"
        onclick="importExcel()"
        {% if role_info.role not in ["Admin", "Supervisor"] %}disabled{% endif %}>
        📥 Import Excel
    </button>
    <!-- NEW: Import Logs — Admin-only, shows who uploaded what and when -->
    {% if role_info.is_admin %}
    <button
        class="btn-transfer"
        onclick="viewImportLogs()">
        📋 Import Logs
    </button>
    {% endif %}
    <button
        class="btn-transfer"
        onclick="toggleTransferMode()"
        {% if role_info.role == "Viewer" %}disabled{% endif %}>
        🔄 Manage Manpower
    </button>
    <button
        class="btn-export"
        onclick="exportAttendance()">
        📤 Export Attendance
    </button>
    <input
        type="file"
        id="excelFile"
        accept=".xlsx,.xls"
        style="display:none"
        onchange="uploadExcel()"
    >
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- MODAL (assign from unassigned pool) -->
<div class="modal" id="modal">
    <div class="box">
        <h3>Select Employees</h3>
        <input
            type="text"
            id="empSearch"
            placeholder="Search employee..."
            style="width:100%;padding:8px 10px;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius-sm);"
            oninput="filterEmployees(this.value)"
        >
        <div id="employeeList" style="max-height:300px;overflow:auto;"></div>
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
            <button class="btn-add" onclick="assignSelected()">Assign Selected</button>
            <button class="btn-save" onclick="openAbsentEmployeeModal()">+ Add Absent Employee</button>
            <button class="btn-reset" onclick="closeModal()">Close</button>
        </div>
    </div>
</div>

<!-- TRANSFER MODAL (Manage Manpower: pick employees + destination line) -->
<div class="modal" id="transferModal">
    <div class="box" style="width:640px;">
        <h3>🔄 Transfer Employees</h3>

        <input type="text" id="transferEmpSearch" placeholder="Search employee..."
            style="width:100%;padding:8px 10px;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius-sm);"
            oninput="filterTransferEmployeeList(this.value)">

        <div id="transferEmployeeList" class="scroll-box" style="margin-bottom:16px;"></div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
            <div class="filter-group" style="flex:1;min-width:180px;">
                <label class="filter-label">Destination Line</label>
                <select id="transferLineSelect" class="filter-select" style="width:100%;"></select>
            </div>
            <div class="filter-group" style="flex:1;min-width:180px;">
                <label class="filter-label">Section / Process</label>
                <select id="transferNewSection" class="filter-select" style="width:100%;"><option value="">Select section / process</option></select>
            </div>
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="confirmTransferExecute()">Transfer Selected</button>
            <button class="btn-reset" onclick="closeTransferModal()">Cancel</button>
        </div>
    </div>
</div>

</div><!-- main-content -->

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="/static/js/dashboard/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="/static/js/dashboard/attendance_export.js"></script>
</body>
</html>
